[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rif"
version = "0.1.0"
description = "Resonant Inference Field (Bentov-2.0): body-brain phase alignment and connectome harmonics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Albert Tan" },
  { name = "RIF Contributors" }
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10"
]

[project.optional-dependencies]
analysis = [
  "mne>=1.6",
  "matplotlib>=3.7"
]
dev = [
  "pytest>=7.0",
  "black>=23.0",
  "flake8>=6.0",
  "isort>=5.12",
  "mypy>=1.3"
]
docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.5"
]

[project.urls]
Homepage = "https://github.com/Albertito-AI/AlberTito-MasterMind"
Issues = "https://github.com/Albertito-AI/AlberTito-MasterMind/issues"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true
strict_optional = true
